name: Build Nexus OS for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find Nexus OS project
        shell: pwsh
        run: |
          $packages = Get-ChildItem $env:GITHUB_WORKSPACE -Filter package.json -Recurse -File
          $match = $null

          foreach ($pkg in $packages) {
            try {
              $json = Get-Content $pkg.FullName -Raw | ConvertFrom-Json
              if ($json.name -eq 'nexus-os') {
                $match = $pkg
                break
              }
            } catch {}
          }

          if (-not $match) {
            throw "Could not find the Nexus OS package.json."
          }

          $project = $match.Directory.FullName
          "NEXUS_PROJECT_DIR=$project" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using Nexus OS project: $project"

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location $env:NEXUS_PROJECT_DIR
          npm install --no-audit --no-fund

      - name: Validate project
        shell: pwsh
        run: |
          Set-Location $env:NEXUS_PROJECT_DIR
          node --check main.js
          node --check preload.js
          node --check guest-preload.js
          node check-project.js

      - name: Build Windows installer
        shell: pwsh
        run: |
          Set-Location $env:NEXUS_PROJECT_DIR
          npm run dist

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-OS-Windows
          path: ${{ env.NEXUS_PROJECT_DIR }}/dist/*
          if-no-files-found: error
          retention-days: 14
