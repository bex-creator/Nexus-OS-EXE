name: Release Nexus OS for Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Nexus OS version to publish, for example 4.22.0 or 4.23.0'
        required: true
        type: string
      release_notes:
        description: 'Optional release notes'
        required: false
        type: string
        default: 'Nexus OS Windows update'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Locate Nexus OS project
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter package.json -Recurse -File
          $match = $null
          foreach ($pkg in $packages) {
            try {
              $json = Get-Content $pkg.FullName -Raw | ConvertFrom-Json
              if ($json.name -eq 'nexus-os') { $match = $pkg; break }
            } catch {}
          }
          if (-not $match) { throw 'Could not find Nexus OS package.json.' }
          $projectDir = $match.Directory.FullName
          "NEXUS_PROJECT_DIR=$projectDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Nexus OS project: $projectDir"

      - name: Set requested version
        shell: pwsh
        run: |
          Set-Location $env:NEXUS_PROJECT_DIR
          $newVersion = '${{ inputs.version }}'.TrimStart('v')
          if ($newVersion -notmatch '^\d+\.\d+\.\d+$') { throw "Version must look like 4.23.0" }

          $pkgPath = Join-Path $env:NEXUS_PROJECT_DIR 'package.json'
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          $oldVersion = [version]$pkg.version
          $targetVersion = [version]$newVersion
          if ($targetVersion -lt $oldVersion) { throw "Version $newVersion cannot be lower than current version $($pkg.version)." }
          if ($targetVersion -gt $oldVersion) {
            $pkg.version = $newVersion
            $pkg | ConvertTo-Json -Depth 20 | Set-Content $pkgPath -Encoding utf8
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add $pkgPath
            git commit -m "Release Nexus OS v$newVersion"
            git push origin main
          }
          "RELEASE_VERSION=$newVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create release tag
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (git tag -l "v${{ env.RELEASE_VERSION }}") { throw "Tag v${{ env.RELEASE_VERSION }} already exists." }
          git tag "v${{ env.RELEASE_VERSION }}"
          git push origin "v${{ env.RELEASE_VERSION }}"

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location $env:NEXUS_PROJECT_DIR
          npm install --no-audit --no-fund

      - name: Validate project
        shell: pwsh
        run: |
          Set-Location $env:NEXUS_PROJECT_DIR
          node --check main.js
          node --check preload.js
          node --check guest-preload.js
          node check-project.js

      - name: Publish Windows Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Set-Location $env:NEXUS_PROJECT_DIR
          npm run release

      - name: Write release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = @'
          ${{ inputs.release_notes }}
          '@
          gh release edit "v${{ env.RELEASE_VERSION }}" --repo "${{ github.repository }}" --title "Nexus OS v${{ env.RELEASE_VERSION }}" --notes "$notes" --draft=false
