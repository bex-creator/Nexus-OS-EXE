name: Release Nexus OS for Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (example: 4.22.1)"
        required: true
        type: string
      release_notes:
        description: "Release notes"
        required: false
        default: "Nexus OS Windows update"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Locate Nexus OS project
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter package.json -Recurse -File
          $match = $null

          foreach ($pkg in $packages) {
            try {
              $json = Get-Content $pkg.FullName -Raw | ConvertFrom-Json
              if ($json.name -eq "nexus-os") {
                $match = $pkg
                break
              }
            } catch {}
          }

          if (-not $match) {
            throw "Could not find Nexus OS package.json."
          }

          $projectDir = $match.Directory.FullName
          "NEXUS_PROJECT_DIR=$projectDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Nexus OS project: $projectDir"

      - name: Set version
        shell: pwsh
        run: |
          Set-Location $env:NEXUS_PROJECT_DIR

          $version = "${{ inputs.version }}".TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must look like 4.22.1"
          }

          $pkgPath = Join-Path $env:NEXUS_PROJECT_DIR "package.json"
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          $current = [version]$pkg.version
          $requested = [version]$version

          if ($requested -lt $current) {
            throw "Requested version $version is lower than current version $($pkg.version)."
          }

          if ($requested -gt $current) {
            $pkg.version = $version
            $pkg | ConvertTo-Json -Depth 20 | Set-Content $pkgPath -Encoding utf8

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json
            git commit -m "Release Nexus OS v$version"
            git push origin HEAD:main
          }

          "RELEASE_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure release tag exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags --force

          $tag = "v$env:RELEASE_VERSION"

          $tagExists = git show-ref --tags --verify --quiet "refs/tags/$tag"
          if (-not $tagExists) {
            git tag "$tag"
            git push origin "$tag"
            Write-Host "Created tag $tag"
          } else {
            Write-Host "Tag $tag already exists. Reusing it."
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location $env:NEXUS_PROJECT_DIR
          npm install --no-audit --no-fund

      - name: Validate project
        shell: pwsh
        run: |
          Set-Location $env:NEXUS_PROJECT_DIR
          node --check main.js
          node --check preload.js
          node --check guest-preload.js
          node check-project.js

      - name: Build Windows installer and update metadata
        shell: pwsh
        run: |
          Set-Location $env:NEXUS_PROJECT_DIR
          npx electron-builder --win nsis --publish never

      - name: Inspect build output
        shell: pwsh
        run: |
          $dist = Join-Path $env:NEXUS_PROJECT_DIR "dist"

          if (-not (Test-Path $dist)) {
            throw "Build output folder not found: $dist"
          }

          $files = Get-ChildItem $dist -File
          if (-not $files) {
            throw "No files were produced in dist."
          }

          Write-Host "Build output:"
          $files | Select-Object Name, Length

          if (-not (Test-Path (Join-Path $dist "latest.yml"))) {
            throw "latest.yml was not generated. Auto-update metadata is missing."
          }

          $installer = Get-ChildItem $dist -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer EXE was not generated."
          }

          Write-Host "Installer: $($installer.FullName)"

      - name: Create or reuse GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $repo = "${{ github.repository }}"

          gh release view $tag --repo $repo *> $null

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists. Reusing it."
          } else {
            Write-Host "Creating release $tag."
            gh release create $tag `
              --repo $repo `
              --title "Nexus OS v$env:RELEASE_VERSION" `
              --notes '${{ inputs.release_notes }}' `
              --target main
          }

      - name: Upload installer and update metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Set-Location $env:NEXUS_PROJECT_DIR
          $repo = "${{ github.repository }}"
          $tag = "v$env:RELEASE_VERSION"

          gh release upload $tag `
            --repo $repo `
            --clobber `
            dist/*.exe `
            dist/latest.yml `
            dist/*.blockmap

      - name: Publish release and update notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = "${{ github.repository }}"
          $tag = "v$env:RELEASE_VERSION"

          gh release edit $tag `
            --repo $repo `
            --title "Nexus OS v$env:RELEASE_VERSION" `
            --notes '${{ inputs.release_notes }}' `
            --draft=false `
            --prerelease=false

      - name: Show release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "v$env:RELEASE_VERSION" --repo "${{ github.repository }}"
