name: Release Nexus OS for Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, for example 4.22.1'
        required: true
        type: string
      release_notes:
        description: 'Release notes'
        required: false
        type: string
        default: 'Nexus OS Windows update'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Locate Nexus OS project
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter package.json -Recurse -File
          $match = $null

          foreach ($pkg in $packages) {
            try {
              $json = Get-Content $pkg.FullName -Raw | ConvertFrom-Json
              if ($json.name -eq 'nexus-os') {
                $match = $pkg
                break
              }
            } catch {}
          }

          if (-not $match) {
            throw 'Could not find Nexus OS package.json.'
          }

          $projectDir = $match.Directory.FullName
          "NEXUS_PROJECT_DIR=$projectDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Nexus OS project: $projectDir"

      - name: Set version
        shell: pwsh
        run: |
          Set-Location $env:NEXUS_PROJECT_DIR

          $version = '${{ inputs.version }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must look like 4.22.1"
          }

          $pkgPath = Join-Path $env:NEXUS_PROJECT_DIR 'package.json'
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json

          $oldVersion = [version]$pkg.version
          $newVersion = [version]$version

          if ($newVersion -lt $oldVersion) {
            throw "Version $version cannot be lower than current version $($pkg.version)."
          }

          if ($newVersion -gt $oldVersion) {
            $pkg.version = $version
            $pkg | ConvertTo-Json -Depth 20 | Set-Content $pkgPath -Encoding utf8

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package.json
            git commit -m "Release Nexus OS v$version"
            git push origin HEAD:main
          }

          "RELEASE_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure release tag exists
        shell: pwsh
        run: |
          git fetch --tags --force
          $tag = "v$env:RELEASE_VERSION"

          if (git show-ref --tags --verify --quiet "refs/tags/$tag") {
            Write-Host "Tag $tag already exists. Reusing it."
          } else {
            git tag $tag
            git push origin $tag
            Write-Host "Created tag $tag."
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location $env:NEXUS_PROJECT_DIR
          npm install --no-audit --no-fund

      - name: Validate project
        shell: pwsh
        run: |
          Set-Location $env:NEXUS_PROJECT_DIR
          node --check main.js
          node --check preload.js
          node --check guest-preload.js
          node check-project.js

      - name: Publish Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Set-Location $env:NEXUS_PROJECT_DIR
          npx electron-builder --win nsis --publish always

      - name: Update release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = @'
          ${{ inputs.release_notes }}
          '@

          gh release edit "v$env:RELEASE_VERSION" `
            --repo "${{ github.repository }}" `
            --title "Nexus OS v$env:RELEASE_VERSION" `
            --notes "$notes" `
            --draft=false

      - name: Show release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "v$env:RELEASE_VERSION" --repo "${{ github.repository }}"
